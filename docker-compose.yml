# Lab: Wazuh single-node + agent (auth.log, Coraza log) + Caddy/Coraza WAF + alert Zalo
# Chay duoc ca Docker rootless lan rootful. Chay ./setup.sh truoc de tao .env, cert, internal_users.yml, ossec.conf
name: wazuh-lab

services:
  wazuh.manager:
    image: wazuh/wazuh-manager:${WAZUH_VERSION}
    hostname: wazuh.manager
    restart: always
    # Khong set ulimits: rootless khong nang duoc memlock/nofile vuot hard limit cua dockerd.
    # Container ke thua LimitNOFILE=infinity cua docker.service (user). Indexer single-node khong bat bootstrap check.
    ports:
      - "1514:1514"
      - "1515:1515"
      - "127.0.0.1:55000:55000"
    environment:
      - INDEXER_URL=https://wazuh.indexer:9200
      - INDEXER_USERNAME=admin
      - INDEXER_PASSWORD=${INDEXER_PASSWORD}
      - FILEBEAT_SSL_VERIFICATION_MODE=full
      - SSL_CERTIFICATE_AUTHORITIES=/etc/ssl/root-ca.pem
      - SSL_CERTIFICATE=/etc/ssl/filebeat.pem
      - SSL_KEY=/etc/ssl/filebeat.key
      - API_USERNAME=wazuh-wui
      - API_PASSWORD=${API_PASSWORD}
    volumes:
      - wazuh_api_configuration:/var/ossec/api/configuration
      - wazuh_etc:/var/ossec/etc
      - wazuh_logs:/var/ossec/logs
      - wazuh_queue:/var/ossec/queue
      - wazuh_var_multigroups:/var/ossec/var/multigroups
      - wazuh_integrations:/var/ossec/integrations
      - wazuh_active_response:/var/ossec/active-response/bin
      - wazuh_agentless:/var/ossec/agentless
      - wazuh_wodles:/var/ossec/wodles
      - filebeat_etc:/etc/filebeat
      - filebeat_var:/var/lib/filebeat
      - ./config/wazuh_indexer_ssl_certs/root-ca-manager.pem:/etc/ssl/root-ca.pem
      - ./config/wazuh_indexer_ssl_certs/wazuh.manager.pem:/etc/ssl/filebeat.pem
      - ./config/wazuh_indexer_ssl_certs/wazuh.manager-key.pem:/etc/ssl/filebeat.key
      # File trong /wazuh-config-mount duoc copy de len /var/ossec moi lan container start
      - ./config/wazuh_cluster/wazuh_manager.conf:/wazuh-config-mount/etc/ossec.conf
      - ./config/wazuh_cluster/authd.pass:/wazuh-config-mount/etc/authd.pass
      - ./config/wazuh_cluster/rules/local_rules.xml:/wazuh-config-mount/etc/rules/local_rules.xml
      - ./config/wazuh_cluster/decoders/local_decoder.xml:/wazuh-config-mount/etc/decoders/local_decoder.xml
      # Mount thang (khong qua config-mount) de giu quyen 755, integratord chay bang user wazuh
      - ./config/wazuh_cluster/integrations/custom-zalo:/var/ossec/integrations/custom-zalo:ro
      - ./config/wazuh_cluster/integrations/custom-zalo.py:/var/ossec/integrations/custom-zalo.py:ro
      # Trust store cua host cho integration Zalo (can khi mang chen CA rieng de soi SSL)
      - ${HOST_CA_BUNDLE:-/etc/ssl/certs/ca-certificates.crt}:/etc/ssl/host-ca-bundle.crt:ro

  wazuh.indexer:
    image: wazuh/wazuh-indexer:${WAZUH_VERSION}
    hostname: wazuh.indexer
    restart: always
    ports:
      - "127.0.0.1:9200:9200"
    environment:
      - "OPENSEARCH_JAVA_OPTS=-Xms1g -Xmx1g"
    volumes:
      - wazuh-indexer-data:/var/lib/wazuh-indexer
      - ./config/wazuh_indexer_ssl_certs/root-ca.pem:/usr/share/wazuh-indexer/config/certs/root-ca.pem
      - ./config/wazuh_indexer_ssl_certs/wazuh.indexer-key.pem:/usr/share/wazuh-indexer/config/certs/wazuh.indexer.key
      - ./config/wazuh_indexer_ssl_certs/wazuh.indexer.pem:/usr/share/wazuh-indexer/config/certs/wazuh.indexer.pem
      - ./config/wazuh_indexer_ssl_certs/admin.pem:/usr/share/wazuh-indexer/config/certs/admin.pem
      - ./config/wazuh_indexer_ssl_certs/admin-key.pem:/usr/share/wazuh-indexer/config/certs/admin-key.pem
      - ./config/wazuh_indexer/wazuh.indexer.yml:/usr/share/wazuh-indexer/config/opensearch.yml
      - ./config/wazuh_indexer/internal_users.yml:/usr/share/wazuh-indexer/config/opensearch-security/internal_users.yml

  wazuh.dashboard:
    image: wazuh/wazuh-dashboard:${WAZUH_VERSION}
    hostname: wazuh.dashboard
    restart: always
    ports:
      - "${DASHBOARD_PORT:-8443}:5601"   # rootless khong mo duoc port < 1024
    environment:
      - INDEXER_USERNAME=admin
      - INDEXER_PASSWORD=${INDEXER_PASSWORD}
      - WAZUH_API_URL=https://wazuh.manager
      - DASHBOARD_USERNAME=kibanaserver
      - DASHBOARD_PASSWORD=${DASHBOARD_PASSWORD}
      - API_USERNAME=wazuh-wui
      - API_PASSWORD=${API_PASSWORD}
    volumes:
      - ./config/wazuh_indexer_ssl_certs/wazuh.dashboard.pem:/usr/share/wazuh-dashboard/certs/wazuh-dashboard.pem
      - ./config/wazuh_indexer_ssl_certs/wazuh.dashboard-key.pem:/usr/share/wazuh-dashboard/certs/wazuh-dashboard-key.pem
      - ./config/wazuh_indexer_ssl_certs/root-ca.pem:/usr/share/wazuh-dashboard/certs/root-ca.pem
      - ./config/wazuh_dashboard/opensearch_dashboards.yml:/usr/share/wazuh-dashboard/config/opensearch_dashboards.yml
      - wazuh-dashboard-config:/usr/share/wazuh-dashboard/data/wazuh/config
      - wazuh-dashboard-custom:/usr/share/wazuh-dashboard/plugins/wazuh/public/assets/custom
    depends_on:
      - wazuh.indexer
      - wazuh.manager

  # (2)+(4) Agent: doc auth.log cua host + audit log cua Coraza, gui ve manager
  wazuh.agent:
    image: wazuh/wazuh-agent:${WAZUH_VERSION}
    hostname: ${AGENT_NAME}
    restart: always
    environment:
      - WAZUH_MANAGER_SERVER=wazuh.manager
      - WAZUH_REGISTRATION_PASSWORD=${ENROLLMENT_PASSWORD}
      - WAZUH_AGENT_NAME=${AGENT_NAME}
    volumes:
      - ./config/wazuh_agent/ossec.conf:/wazuh-config-mount/etc/ossec.conf
      # Giu client.keys qua cac lan recreate, khong thi agent enroll lai va bi manager tu choi
      # vi trung ten ("Duplicate agent name")
      - wazuh_agent_etc:/var/ossec/etc
      # Mount thu muc, khong mount file: logrotate doi inode, mount file se ket o file cu
      - ${AUTH_LOG_DIR}:/var/log/host:ro
      - coraza_logs:/var/log/coraza:ro
    depends_on:
      - wazuh.manager

  # (3) WAF: Caddy + Coraza + CRS v4
  waf:
    build: ./waf
    image: wazuh-lab/caddy-coraza:local
    restart: always
    ports:
      - "${WAF_HTTP_PORT}:80"
    environment:
      - WAF_MODE=${WAF_MODE}
      - WAF_UPSTREAM=${WAF_UPSTREAM}
    volumes:
      - ./waf/Caddyfile:/etc/caddy/Caddyfile:ro   # sua Caddyfile/exclusion khong can build lai
      - coraza_logs:/var/log/coraza

  # App demo dung sau WAF. Doi WAF_UPSTREAM trong .env de tro sang app that.
  backend:
    image: mccutchen/go-httpbin:latest
    restart: always

volumes:
  wazuh_api_configuration:
  wazuh_etc:
  wazuh_logs:
  wazuh_queue:
  wazuh_var_multigroups:
  wazuh_integrations:
  wazuh_active_response:
  wazuh_agentless:
  wazuh_wodles:
  filebeat_etc:
  filebeat_var:
  wazuh-indexer-data:
  wazuh-dashboard-config:
  wazuh-dashboard-custom:
  coraza_logs:
  wazuh_agent_etc:
